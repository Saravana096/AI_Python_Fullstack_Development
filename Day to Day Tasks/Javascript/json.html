<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Todos</title>

    <link
        rel="stylesheet"
        href="json.css"
    >

</head>


<body>

    <div class="todo-app">

        <h1>My Todos</h1>


        <div class="todo-input">

            <input
                type="text"
                id="new-todo"
                placeholder="Add new task..."
            >

            <button id="add-btn">
                Add
            </button>

        </div>


        <ul id="todo-list"></ul>

    </div>


    <script src="json.js"></script>

</body>

</html>
