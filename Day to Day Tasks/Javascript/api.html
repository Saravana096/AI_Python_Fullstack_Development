<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List API</title>

    <link rel="stylesheet" href="api.css">
</head>

<body>

    <div class="container">

        <h1>Todo List with API</h1>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Loading message -->
        <p id="loadingMessage"></p>


        <!-- Error message -->
        <p id="errorMessage"></p>


        <!-- Todo list -->
        <div id="todoList"></div>

    </div>


    <script src="api.js"></script>

</body>

</html>
