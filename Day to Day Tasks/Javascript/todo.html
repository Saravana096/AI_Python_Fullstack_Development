<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="todo.css">
</head>

<body>

    <div class="container">

        <h1>My Todo List</h1>

        <!-- Add Todo -->
        <div class="todo-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Todo List -->
        <div id="todoList"></div>


        <!-- Clear All -->
        <button id="clearButton">
            Clear All
        </button>

    </div>


    <script src="todo.js"></script>

</body>

</html>
